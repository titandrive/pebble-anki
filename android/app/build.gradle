plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pebbleanki'
    compileSdk 34

    defaultConfig {
        applicationId "com.pebbleanki"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // PebbleKit Android — communicates with the Rebble/Pebble app over Bluetooth.
    // If JitPack fails, download pebblekit-android-4.0.1.aar from
    // https://github.com/pebble/pebble-android-sdk/releases and drop it in app/libs/.
    implementation 'com.github.pebble:pebble-android-sdk:v4.0.1'
}
